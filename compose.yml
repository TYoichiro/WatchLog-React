services:
  db:
    image: postgres:16-alpine3.24
    # 1日1回、最新パッチのイメージを取得する（古いイメージに OS の脆弱性が残るのを防ぐ）
    pull_policy: daily
    environment:
      POSTGRES_DB: watchlog
      POSTGRES_USER: watchlog
      POSTGRES_PASSWORD: watchlog
      # OS の時計・psql の表示を JST にする（TZ は初回の initdb の設定にも使われる）
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    # DB サーバーの既定のタイムゾーンとログの時刻を JST にする（既存のボリュームにも効く）
    command: ["postgres", "-c", "timezone=Asia/Tokyo", "-c", "log_timezone=Asia/Tokyo"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ローカル開発（npm run dev:api）から接続するために公開する。外部からは接続させない
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlog -d watchlog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # マイグレーションを適用して終了する。シードは docker compose run --rm migrate npx prisma db seed
  migrate:
    build:
      context: .
      target: migrator
      pull: true
    image: watchlog-react-migrate
    environment:
      TZ: Asia/Tokyo
      DATABASE_URL: postgresql://watchlog:watchlog@db:5432/watchlog?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      # ビルドのたびにベースイメージの最新パッチを取得する
      pull: true
    image: watchlog-react
    ports:
      - "3000:3000"
    # 認証の秘密情報（AUTH_SECRET・AUTH_GOOGLE_ID・AUTH_GOOGLE_SECRET）は apps/api/.env から読み込む
    env_file:
      - path: apps/api/.env
        required: false
    # .env のローカル開発用の値（PORT=3001 など）より優先する
    environment:
      DATABASE_URL: postgresql://watchlog:watchlog@db:5432/watchlog?schema=public
      PORT: "3000"
      AUTH_URL: http://localhost:3000/api/auth
    volumes:
      - app_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  # logs/YYYY-MM-DD.log（JST の日付ごとのアプリのログ）
  app_logs:

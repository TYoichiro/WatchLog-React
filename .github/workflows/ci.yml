name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine3.24
        env:
          POSTGRES_DB: watchlog
          POSTGRES_USER: watchlog
          POSTGRES_PASSWORD: watchlog
          # サービスコンテナは起動コマンドを変えられないので、initdb が TZ から既定のタイムゾーンを JST に設定する
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchlog -d watchlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: Asia/Tokyo
      # Prisma の統合テスト（apps/api/src/lib/prisma.test.ts）が使う
      DATABASE_URL: postgresql://watchlog:watchlog@localhost:5432/watchlog?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run prisma:migrate -w @watchlog/api
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start db → migrate → app
        run: docker compose up -d --build
      - name: Smoke test
        run: |
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/api && break; sleep 1; done
          test "$(curl -sf http://localhost:3000/api)" = "{}"
          curl -sf -o /dev/null http://localhost:3000/
          test "$(docker compose ps -a --format '{{.ExitCode}}' migrate)" = "0"
          docker compose exec -T app node --input-type=module -e '
            const { prisma } = await import("/app/apps/api/dist/lib/prisma.js");
            await prisma.role.count();
            await prisma.$disconnect();
          '
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
